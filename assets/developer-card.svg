<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Elecmonkey - TypeScript Rust Go Developer</title>
  <desc id="desc">A clean GitHub-style profile card highlighting TypeScript, Rust, and Go.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f6f8fa; }
      .card { fill: #ffffff; }
      .border { stroke: #d0d7de; }
      .soft-border { stroke: #d8dee4; }
      .text { fill: #24292f; }
      .muted { fill: #57606a; }
      .track { stroke: #d8dee4; }
      .bar-track { fill: #d8dee4; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .panel { fill: #161b22; }
        .card { fill: #0d1117; }
        .border { stroke: #30363d; }
        .soft-border { stroke: #30363d; }
        .text { fill: #e6edf3; }
        .muted { fill: #8b949e; }
        .track { stroke: #30363d; }
        .bar-track { fill: #30363d; }
      }
    </style>
    <clipPath id="stackBarClip">
      <rect x="125" y="34" width="167" height="4" rx="2" />
    </clipPath>
    <filter id="lift" x="-15%" y="-25%" width="130%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2328" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="319" rx="16" class="bg border" />

  <g transform="translate(42 58)">
    <image href="./loop_contour_trace_smooth_sm.svg" x="0" y="0" width="64" height="64" clip-path="inset(0 round 15px)" />
    <rect x="0.5" y="0.5" width="63" height="63" rx="15" class="soft-border" fill="none" />
    <text x="86" y="6" class="sans text" font-size="34" font-weight="700" dominant-baseline="hanging">Elecmonkey</text>
    <text x="88" y="57" class="mono muted" font-size="15">@elecmonkey</text>
  </g>

  <g transform="translate(42 185)">
    <rect x="0.5" y="0.5" width="333" height="72" rx="12" class="panel border" />
    <circle cx="31" cy="36" r="8" fill="#3178c6" />
    <circle cx="59" cy="36" r="8" fill="#dea584" />
    <circle cx="87" cy="36" r="8" fill="#00add8" />
    <rect x="125" y="34" width="167" height="4" rx="2" class="bar-track" />
    <g clip-path="url(#stackBarClip)">
      <rect x="125" y="34" width="83.5" height="4" fill="#3178c6" />
      <rect x="208.5" y="34" width="41.75" height="4" fill="#dea584" />
      <rect x="250.25" y="34" width="41.75" height="4" fill="#00add8" />
    </g>
  </g>

  <g transform="translate(452 47)">
    <path d="M56 110C128 28 225 31 292 96C350 153 424 140 467 79" class="track" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 9" />
    <path d="M77 157C140 214 221 208 279 151C332 99 407 107 455 163" class="track" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 9" />

    <g transform="translate(12 74) rotate(-4 118 41)" filter="url(#lift)">
      <rect x="0.5" y="0.5" width="236" height="82" rx="14" class="card border" />
      <rect x="17" y="17" width="48" height="48" rx="11" fill="#3178c6" fill-opacity="0.12" />
      <image href="./typescript-plain.svg" x="25" y="25" width="32" height="32" />
      <text x="82" y="37" class="sans text" font-size="20" font-weight="700">TypeScript</text>
      <text x="82" y="59" class="mono muted" font-size="12">.ts .tsx</text>
      <circle cx="211" cy="41" r="6" fill="#3178c6" />
    </g>

    <g transform="translate(263 22) rotate(5 107 41)" filter="url(#lift)">
      <rect x="0.5" y="0.5" width="214" height="82" rx="14" class="card border" />
      <rect x="17" y="17" width="48" height="48" rx="11" fill="#dea584" fill-opacity="0.14" />
      <image href="./rust-original.svg" x="23" y="23" width="36" height="36" />
      <text x="82" y="37" class="sans text" font-size="20" font-weight="700">Rust</text>
      <text x="82" y="59" class="mono muted" font-size="12">.rs</text>
      <circle cx="189" cy="41" r="6" fill="#dea584" />
    </g>

    <g transform="translate(214 154) rotate(-2 112 41)" filter="url(#lift)">
      <rect x="0.5" y="0.5" width="224" height="82" rx="14" class="card border" />
      <rect x="17" y="17" width="48" height="48" rx="11" fill="#00add8" fill-opacity="0.12" />
      <image href="./go-original-wordmark.svg" x="13" y="22" width="56" height="36" />
      <text x="82" y="37" class="sans text" font-size="20" font-weight="700">Go</text>
      <text x="82" y="59" class="mono muted" font-size="12">.go</text>
      <circle cx="199" cy="41" r="6" fill="#00add8" />
    </g>
  </g>
</svg>
